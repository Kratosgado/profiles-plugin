<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background rounded square (darker for dark theme) -->
    <rect width="40" height="40" rx="8" fill="url(#bgGradDark)"/>

    <!-- Bottom profile layer (shadow card) -->
    <rect x="9" y="28" width="22" height="3" rx="1.5" fill="white" opacity="0.15"/>

    <!-- Middle profile layer -->
    <rect x="7" y="24" width="26" height="3" rx="1.5" fill="white" opacity="0.3"/>

    <!-- Top active profile card -->
    <rect x="5" y="10" width="30" height="16" rx="3" fill="#1E2736" opacity="0.95"/>

    <!-- Puzzle plug notch (left side of top card) -->
    <rect x="3" y="15" width="4" height="6" rx="1" fill="#1E2736" opacity="0.95"/>
    <circle cx="5" cy="18" r="1.5" fill="url(#bgGradDark)"/>

    <!-- Toggle row 1: enabled (filled dot) -->
    <circle cx="13" cy="15" r="2.5" fill="url(#toggleOnDark)"/>
    <rect x="17" y="14" width="12" height="2" rx="1" fill="#3D4F6B"/>

    <!-- Toggle row 2: disabled -->
    <circle cx="13" cy="22" r="2.5" fill="#3D4F6B"/>
    <rect x="17" y="21" width="9" height="2" rx="1" fill="#3D4F6B"/>

    <defs>
        <linearGradient id="bgGradDark" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2563EB"/>
            <stop offset="0.5" stop-color="#4F46E5"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="toggleOnDark" x1="10.5" y1="12.5" x2="15.5" y2="17.5" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#34D058"/>
            <stop offset="1" stop-color="#60A5FA"/>
        </linearGradient>
    </defs>
</svg>
